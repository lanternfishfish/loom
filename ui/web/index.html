<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Loom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="toolbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
      <defs>
        <linearGradient id="markGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5aa9ff"/>
          <stop offset="1" stop-color="#0071e3"/>
        </linearGradient>
      </defs>
      <rect width="20" height="20" rx="5.5" fill="url(#markGrad)"/>
      <g stroke="#fff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".95">
        <path d="M6.2 5.2v9.6M10 5.2v9.6M13.8 5.2v9.6"/>
        <path d="M4.6 8.2h10.8M4.6 11.8h10.8" opacity=".7"/>
      </g>
    </svg>
    <span class="name">Loom</span>
  </div>

  <span class="badge" id="project" title="STATE.md 里的 PROJECT 行">
    <i class="glyph"></i><span id="projectText">工作区未建</span>
  </span>

  <span class="run" id="runBox">
    <i class="glyph" id="runDot"></i><span id="runText">空闲</span>
    <span class="clock" id="runClock"></span>
  </span>

  <span class="spacer"></span>
  <button id="btnStop" class="btn danger" disabled>打断</button>
  <button id="btnRun" class="btn primary">继续</button>
</header>

<section class="sheet" id="composer" hidden>
  <div class="sheet-card">
    <div class="sheet-label" id="composerLabel">说一句话</div>
    <textarea id="instr" rows="3" spellcheck="false"></textarea>
    <div class="sheet-foot">
      <span class="hint" id="composerHint"></span>
      <span class="spacer"></span>
      <button id="btnCancel" class="btn plain">取消</button>
      <button id="btnSend" class="btn primary">发送</button>
    </div>
  </div>
</section>

<main class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <span class="sb-title">任务</span>
      <span class="sb-count" id="treeCount"></span>
    </div>
    <div class="tree" id="tree"><div class="placeholder">还没有任务</div></div>
  </aside>

  <section class="content">
    <nav class="segmented" id="tabs"></nav>
    <div class="pane" id="detail"><div class="placeholder">从左边选一个任务或会话</div></div>
  </section>

  <aside class="inspector">
    <section class="card">
      <header><h3>STATE.md</h3><span class="sub">planner 写的全局状态</span></header>
      <pre id="stateFile" class="mono-block"></pre>
    </section>
    <section class="card">
      <header><h3>人类指令</h3><span class="sub">human.log</span></header>
      <pre id="humanFile" class="mono-block"></pre>
    </section>
  </aside>
</main>

<section class="console" id="consoleWrap">
  <div class="console-head">
    <span class="c-title">运行日志</span>
    <span class="c-meta" id="consoleMeta"></span>
    <span class="spacer"></span>
    <button id="btnBottom" class="link">回到底部</button>
    <button id="btnFold" class="link">收起</button>
  </div>
  <pre id="console"></pre>
</section>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
